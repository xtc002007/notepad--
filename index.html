<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notepad--</title>
  <!-- Preload critical CSS -->
  <link rel="preload" href="/tailwind.css" as="style">
  <link rel="stylesheet" href="/tailwind.css">
  <script>
    // Tailwind dark mode config (execute immediately to prevent flash)
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }

    // Disable browser's default context menu for a more native app feel
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>
  <!-- Defer module loading to not block initial paint -->
  <script type="module" src="/index.tsx"></script>
</head>

<body class="bg-white dark:bg-slate-950">
  <div id="root"></div>

  <!-- Splash Screen: Pure HTML/CSS animation that shows instantly before React loads -->
  <div id="app-loading" class="splash-screen">
    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #ffffff;
        opacity: 1;
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
      }

      .splash-screen.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      /* Dark mode */
      @media (prefers-color-scheme: dark) {
        .splash-screen {
          background: #020617;
        }
        .splash-logo { color: #e2e8f0; }
        .splash-subtitle { color: #94a3b8; }
        .splash-progress-bar { background: #1e293b; }
        .splash-progress-fill { background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
        .splash-dots span { background: #475569; }
        .splash-dots span.active { background: #60a5fa; }
      }

      html.dark .splash-screen {
        background: #020617;
      }
      html.dark .splash-logo { color: #e2e8f0; }
      html.dark .splash-subtitle { color: #94a3b8; }
      html.dark .splash-progress-bar { background: #1e293b; }
      html.dark .splash-progress-fill { background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
      html.dark .splash-dots span { background: #475569; }
      html.dark .splash-dots span.active { background: #60a5fa; }

      /* Logo animation */
      .splash-logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: splash-enter 0.6s ease-out both;
      }

      @keyframes splash-enter {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Icon */
      .splash-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        position: relative;
      }

      .splash-icon svg {
        width: 100%;
        height: 100%;
      }

      .splash-icon-pen {
        animation: pen-write 2s ease-in-out infinite;
        transform-origin: bottom left;
      }

      @keyframes pen-write {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        25% { transform: rotate(-3deg) translateY(-2px); }
        50% { transform: rotate(2deg) translateY(0); }
        75% { transform: rotate(-1deg) translateY(-1px); }
      }

      /* App name */
      .splash-logo {
        font-size: 28px;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .splash-logo .accent {
        color: #3b82f6;
      }

      .splash-subtitle {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 32px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        animation: subtitle-fade 0.6s ease-out 0.3s both;
      }

      @keyframes subtitle-fade {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Progress bar */
      .splash-progress-bar {
        width: 200px;
        height: 3px;
        background: #e2e8f0;
        border-radius: 3px;
        overflow: hidden;
        animation: progress-enter 0.4s ease-out 0.5s both;
      }

      @keyframes progress-enter {
        from { opacity: 0; width: 100px; }
        to { opacity: 1; width: 200px; }
      }

      .splash-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #6366f1);
        border-radius: 3px;
        animation: progress-move 1.8s ease-in-out infinite;
      }

      @keyframes progress-move {
        0% { width: 0%; margin-left: 0%; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }

      /* Loading dots */
      .splash-dots {
        display: flex;
        gap: 6px;
        margin-top: 24px;
        animation: dots-enter 0.4s ease-out 0.7s both;
      }

      @keyframes dots-enter {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #cbd5e1;
        animation: dot-pulse 1.4s ease-in-out infinite;
      }

      .splash-dots span:nth-child(1) { animation-delay: 0s; }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes dot-pulse {
        0%, 80%, 100% { transform: scale(1); opacity: 0.4; }
        40% { transform: scale(1.3); opacity: 1; }
      }
    </style>

    <div class="splash-logo-container">
      <!-- Notepad icon with pen animation -->
      <div class="splash-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Notepad body -->
          <rect x="12" y="8" width="40" height="48" rx="4" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
          <!-- Lines on notepad -->
          <line x1="20" y1="22" x2="44" y2="22" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="20" y1="30" x2="38" y2="30" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
          <line x1="20" y1="38" x2="42" y2="38" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
          <!-- Pen -->
          <g class="splash-icon-pen">
            <path d="M42 44 L50 36 L54 40 L46 48 Z" fill="#6366f1" opacity="0.8"/>
            <path d="M46 48 L44 52 L42 44" fill="#4f46e5" opacity="0.6"/>
          </g>
        </svg>
      </div>
      <div class="splash-logo">Notepad<span class="accent">--</span></div>
      <div class="splash-subtitle">Loading your workspace...</div>
      <div class="splash-progress-bar">
        <div class="splash-progress-fill"></div>
      </div>
      <div class="splash-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</body>

</html>
